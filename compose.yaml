services:
  postgres:
    image: postgres:17-alpine
    container_name: feature-flag-trials-postgres
    environment:
      POSTGRES_DB: featureflags
      POSTGRES_USER: featureflags
      POSTGRES_PASSWORD: featureflags
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    container_name: feature-flag-trials-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  redis:
    image: redis:7-alpine
    container_name: feature-flag-trials-redis
    ports:
      - "6379:6379"

volumes:
  postgres-data:
